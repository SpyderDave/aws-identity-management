template:
  type: file
  path: core/all-accounts.py
sceptre_role_session_duration: 7200
dependencies:
  - core/permission-sets.yaml
  - core/opsteam-cloudreadonly.yaml
on_failure: ROLLBACK
ignore: false

sceptre_user_data:
  rolearn: {{environment_variable.AWS_ROLE}}
  SSOInstanceId: {{environment_variable.SSOINSTANCEID}}
  SSOInstanceArn: {{environment_variable.SSOINSTANCEARN}}
  SSMPrefix: "/platform/sso/permissionsets/org"
  GroupName: "core-group-02"
  Permission: "BillingReadOnly"
